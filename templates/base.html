<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RuleForge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='ruleforge.css') }}">
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ url_for('home') }}">RuleForge</a>
    <nav>
      <a href="{{ url_for('workshop') }}">Workshop</a>
      <a href="{{ url_for('history_page') }}">History</a>
    </nav>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <footer class="bar foot">
    <span>Offline. No SIEM connection, no telemetry, no authentication &mdash;
      bound to localhost on purpose.</span>
  </footer>
</body>
</html>
